name: Tests and contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m ruff check services tests scripts
      - run: python -m ruff format --check services tests scripts
      - run: python scripts/export_openapi.py --check
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python scripts/create_local_secrets.py
      - run: docker compose --env-file example.env.txt config --quiet
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker compose -f docker/compose.smoke.yml -p aml-hybrid-smoke up --build --abort-on-container-exit --exit-code-from smoke
      - if: always()
        run: docker compose -f docker/compose.smoke.yml -p aml-hybrid-smoke down --volumes --remove-orphans
