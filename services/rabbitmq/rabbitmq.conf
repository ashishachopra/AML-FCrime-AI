# RabbitMQ 4.2 supports environment interpolation in the modern config format.
# The wrapper sources the password from the mounted Docker secret at runtime.
default_user = $(SEED_USERNAME)
default_pass = $(SEED_USER_PASSWORD)
default_user_tags.administrator = true

default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

management.tcp.port = 15672
