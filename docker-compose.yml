name: aml-reference

x-app-service: &app-service
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  networks:
    - aml-backend

x-rabbit-environment: &rabbit-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
  RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  rabbitmq:
    build: ./services/rabbitmq
    image: aml-reference-rabbitmq:4.2
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - aml-backend

  ingestion:
    <<: *app-service
    build: ./services/ingestion
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      <<: *rabbit-environment
      MAX_BATCH_RECORDS: ${MAX_BATCH_RECORDS:-10000}
      MAX_UPLOAD_FILE_BYTES: ${MAX_UPLOAD_FILE_BYTES:-5242880}
    secrets:
      - rabbitmq_password
    depends_on:
      rabbitmq:
        condition: service_healthy

  feature-engine:
    <<: *app-service
    build: ./services/feature-engine
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      <<: *rabbit-environment
      EVENT_PREFETCH: ${EVENT_PREFETCH:-20}
      VELOCITY_WINDOW_DAYS: ${VELOCITY_WINDOW_DAYS:-30}
      VELOCITY_SHORT_WINDOW_DAYS: ${VELOCITY_SHORT_WINDOW_DAYS:-7}
      FEATURE_DB_PATH: /data/features.db
      FEATURE_MAX_HISTORY_ROWS: ${FEATURE_MAX_HISTORY_ROWS:-1000}
      FEATURE_MAX_NETWORK_ROWS: ${FEATURE_MAX_NETWORK_ROWS:-1000}
      FEATURE_MAX_OUTBOX: ${FEATURE_MAX_OUTBOX:-10000}
      FEATURE_MAX_INFLIGHT: ${FEATURE_MAX_INFLIGHT:-16}
      ANOMALY_MIN_HISTORY: ${ANOMALY_MIN_HISTORY:-20}
      BASE_CURRENCY: ${BASE_CURRENCY:-USD}
      STRUCTURING_THRESHOLDS: ${STRUCTURING_THRESHOLDS:-10000}
      JURISDICTION_DATA_AS_OF: ${JURISDICTION_DATA_AS_OF:-2026-06-19}
      FATF_CALL_FOR_ACTION_COUNTRIES: ${FATF_CALL_FOR_ACTION_COUNTRIES:-IR,KP,MM}
      FATF_INCREASED_MONITORING_COUNTRIES: ${FATF_INCREASED_MONITORING_COUNTRIES:-AO,BA,BG,BO,CD,CI,CM,HT,IQ,KE,KW,LA,LB,MC,NP,PG,SS,SY,VE,VG,VN,YE}
    volumes:
      - feature_data:/data
    secrets:
      - rabbitmq_password
    depends_on:
      rabbitmq:
        condition: service_healthy

  risk-scorer:
    <<: *app-service
    build: ./services/risk-scorer
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      <<: *rabbit-environment
      EVENT_PREFETCH: ${EVENT_PREFETCH:-20}
      RISK_THRESHOLD_ALERT: ${RISK_THRESHOLD_ALERT:-0.7}
      RISK_THRESHOLD_HIGH: ${RISK_THRESHOLD_HIGH:-0.8}
      RISK_THRESHOLD_CRITICAL: ${RISK_THRESHOLD_CRITICAL:-0.9}
    secrets:
      - rabbitmq_password
    depends_on:
      rabbitmq:
        condition: service_healthy

  graph-analysis:
    <<: *app-service
    build: ./services/graph-analysis
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CENTRALITY_THRESHOLD: ${CENTRALITY_THRESHOLD:-0.7}
      COMMUNITY_RISK_THRESHOLD: ${COMMUNITY_RISK_THRESHOLD:-0.6}
      MAX_GRAPH_CONNECTIONS: ${MAX_GRAPH_CONNECTIONS:-1000}

  alert-manager:
    <<: *app-service
    build: ./services/alert-manager
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      <<: *rabbit-environment
      EVENT_PREFETCH: ${EVENT_PREFETCH:-20}
      RISK_THRESHOLD_ALERT: ${RISK_THRESHOLD_ALERT:-0.7}
      RISK_THRESHOLD_SAR: ${RISK_THRESHOLD_SAR:-0.8}
      SAR_GENERATION_ENABLED: ${SAR_GENERATION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini-2026-03-17}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-700}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-8}
      AI_DAILY_CALL_LIMIT: ${AI_DAILY_CALL_LIMIT:-100}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-2}
      AI_MAX_INPUT_BYTES: ${AI_MAX_INPUT_BYTES:-8192}
      AI_FAILURE_THRESHOLD: ${AI_FAILURE_THRESHOLD:-3}
      AI_COOLDOWN_SECONDS: ${AI_COOLDOWN_SECONDS:-300}
      ALERT_DB_PATH: /data/alerts.db
    secrets:
      - rabbitmq_password
    volumes:
      - alert_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:
    <<: *app-service
    build: ./services/gateway
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INGESTION_SERVICE_URL: http://ingestion:8001
      FEATURE_ENGINE_URL: http://feature-engine:8002
      RISK_SCORER_URL: http://risk-scorer:8003
      EVALUATION_TIMEOUT_SECONDS: ${EVALUATION_TIMEOUT_SECONDS:-1.0}
      ALERT_MANAGER_URL: http://alert-manager:8005
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-aml-reference}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-aml-api}
      MAX_UPLOAD_FILE_BYTES: ${MAX_UPLOAD_FILE_BYTES:-5242880}
      GATEWAY_MAX_INFLIGHT: ${GATEWAY_MAX_INFLIGHT:-16}
      GATEWAY_MAX_JSON_BYTES: ${GATEWAY_MAX_JSON_BYTES:-65536}
      GATEWAY_MAX_BATCH_BYTES: ${GATEWAY_MAX_BATCH_BYTES:-16777216}
      GATEWAY_BODY_TIMEOUT_SECONDS: ${GATEWAY_BODY_TIMEOUT_SECONDS:-5}
      GATEWAY_REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-35}
      GATEWAY_REQUESTS_PER_MINUTE: ${GATEWAY_REQUESTS_PER_MINUTE:-120}
      GATEWAY_REQUEST_BURST: ${GATEWAY_REQUEST_BURST:-30}
      GATEWAY_MAX_PRINCIPALS: ${GATEWAY_MAX_PRINCIPALS:-4096}
    secrets:
      - jwt_secret
    depends_on:
      ingestion:
        condition: service_healthy
      feature-engine:
        condition: service_healthy
      risk-scorer:
        condition: service_healthy
      alert-manager:
        condition: service_healthy

secrets:
  rabbitmq_password:
    file: ${RABBITMQ_SECRET_FILE:-./secrets/rabbitmq_password}
  jwt_secret:
    file: ${JWT_SECRET_FILE:-./secrets/jwt_secret}

volumes:
  feature_data:
  alert_data:
  rabbitmq_data:

networks:
  aml-backend:
    name: aml-backend
