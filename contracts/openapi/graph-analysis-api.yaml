openapi: 3.1.0
info:
  title: AML Graph Analysis API
  version: 2.0.0
  description: Deterministic in-memory NetworkX entity analysis.
servers:
  - url: http://127.0.0.1:8004
paths:
  /graph/transactions:
    post:
      summary: Add an identified transaction relationship to the graph.
      responses:
        "201": {description: Relationship added}
        "422": {description: Invalid evidence or graph limit reached}
  /graph/risk/{party_id}:
    get:
      parameters:
        - {name: party_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Deterministic centrality, community, and connected-party indicators}
        "404": {description: Party not found}
  /graph/statistics:
    get:
      responses:
        "200": {description: In-memory graph statistics}
  /metadata:
    get:
      responses:
        "200": {description: Algorithm, policy version, and limitations}

